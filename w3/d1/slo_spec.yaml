version: 1

# SLO Specification - W3-D1
# Derived from baseline.json (3-day synthetic data, 2026-06-01 to 2026-06-03)
# Stack: React frontend (CDN) + FastAPI 4-instance + Postgres primary/replica
# SLO window: 30 days

services:
  # ===========================================================================
  # API TIER
  # Baseline: fail_rate=0.00349 (5xx+429 only), success_rate=0.9763
  # (success_rate includes latency: 2xx/3xx AND latency<500ms / total)
  # p99 latency = 156ms - well under 500ms threshold
  # SLO set at 99.9% - tighter than raw HTTP error budget (0.35%) to account
  # for combined availability+latency SLI definition. Current rate (0.35% fail)
  # leaves healthy error budget at 99.9%.
  # ===========================================================================
  - name: api
    sli:
      name: api_availability_latency
      kind: availability
      formula: "count(2xx OR 3xx AND latency<500ms AND NOT 5xx AND NOT 429) / count(all)"
      promql_good: >-
        sum(rate(http_requests_total{status!~"5..|429",latency_le="500"}[1m]))
      promql_total: >-
        sum(rate(http_requests_total[1m]))
      source: data/access_log.jsonl
    slo:
      target: 0.999          # 99.9% - budget=0.1% >> baseline fail_rate=0.35% raw
      window_days: 30
    budget:
      # events_per_day=691260 x 30 = 20,737,800
      total_events_per_month: 20737800
      # (1 - 0.999) x 20,737,800 = 20,738
      allowed_failures_per_month: 20738
      # 691260/1440 ~= 480 req/min -> 20738/480 ~= 43 min
      downtime_minutes_equivalent: 43

  # ===========================================================================
  # DATABASE TIER
  # Baseline: fail_rate=0.000151, success = query success AND duration<100ms
  # p99 duration = 59ms - very healthy
  # SLO at 99.95% - tighter given DB is critical shared dependency. Current
  # performance (fail_rate=0.015%) well within this budget (0.05%).
  # ===========================================================================
  - name: db
    sli:
      name: db_query_success_latency
      kind: latency
      formula: "count(success=true AND duration<100ms) / count(all)"
      promql_good: >-
        sum(rate(db_queries_total{success="true",duration_le="100"}[1m]))
      promql_total: >-
        sum(rate(db_queries_total[1m]))
      source: data/db_query_log.jsonl
    slo:
      target: 0.9995         # 99.95% - budget=0.05% >> baseline fail_rate=0.015%
      window_days: 30
    budget:
      # events_per_day=57546 x 30 = 1,726,380
      total_events_per_month: 1726380
      # (1 - 0.9995) x 1,726,380 = 863
      allowed_failures_per_month: 863
      # 57546/1440 ~= 40 req/min -> 863/40 ~= 22 min
      downtime_minutes_equivalent: 22

  # ===========================================================================
  # FRONTEND TIER
  # Baseline: success_rate=0.9861 (dom_ready<3000ms AND no js_error AND no net_err)
  # fail_rate=0.01390, dom_ready_p99=1430ms
  # SLO at 98.5% - just below current 98.61% performance to allow a small buffer
  # for genuine user-impacting failures. CDN/RUM metric has more organic noise
  # than API (device-side errors, slow connections) so budget is wider than API.
  # ===========================================================================
  - name: frontend
    sli:
      name: frontend_page_load_ok
      kind: availability
      formula: "count(dom_ready<3000ms AND js_error=false AND network_error=false) / count(all)"
      promql_good: >-
        sum(rate(frontend_rum_events_total{dom_ready_le="3000",js_error="false",network_error="false"}[1m]))
      promql_total: >-
        sum(rate(frontend_rum_events_total[1m]))
      source: data/frontend_rum.jsonl
    slo:
      target: 0.985          # 98.5% - just below current 98.61%, wider budget for RUM noise
      window_days: 30
    budget:
      # events_per_day=172800 x 30 = 5,184,000
      total_events_per_month: 5184000
      # (1 - 0.985) x 5,184,000 = 77,760
      allowed_failures_per_month: 77760
      # 172800/1440 = 120 req/min -> 77760/120 = 648 min ~= 10.8 h
      downtime_minutes_equivalent: 648
