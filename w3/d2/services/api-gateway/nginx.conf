events {
    worker_connections 1024;
}

http {
    upstream payment_svc {
        server payment-svc:8080;
    }

    upstream inventory_svc {
        server inventory-svc:8080;
    }

    upstream notification_svc {
        server notification-svc:8080;
    }

    upstream checkout_svc {
        server checkout-svc:8080;
    }

    upstream auth_svc {
        server auth-svc:8080;
    }

    server {
        listen 8080;
        
        location /api/payment {
            proxy_pass http://payment_svc;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/inventory {
            proxy_pass http://inventory_svc;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/notification {
            proxy_pass http://notification_svc;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/checkout {
            proxy_pass http://checkout_svc;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /checkout/health {
            proxy_pass http://checkout_svc/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/auth {
            proxy_pass http://auth_svc;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /stub_status {
            stub_status;
        }
    }
}
