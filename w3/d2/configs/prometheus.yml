global:
  scrape_interval: 15s
  evaluation_interval: 15s



alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  - job_name: services
    static_configs:
      - targets:
          - api-gateway:8080
          - payment-svc:8080
          - inventory-svc:8080
          - notification-svc:8080
          - checkout-svc:8080
          - auth-svc:8080
        labels: {tier: app}

  - job_name: infra
    static_configs:
      - targets:
          - payment-db:9187
          - inventory-db:9187
          - cache-svc:9121
          - log-collector:9100
        labels: {tier: infra}

  - job_name: aiops-pipeline
    static_configs:
      - targets: [aiops-pipeline:8000]
        labels: {tier: pipeline}
