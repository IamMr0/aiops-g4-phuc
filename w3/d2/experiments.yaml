experiments:
  - id: 1
    name: payment_latency
    fault_type: latency
    target: payment-svc
    hypothesis: |
      Steady-state: probe pass-rate >= 99%, p99 latency < 500ms.
      Injecting 500ms ± 100ms delay on payment-svc network egress for 60s,
      pipeline detector fires latency anomaly within 30s and RCA picks payment-svc.
      probe pass-rate may drop to 70-80% during inject (acceptable).
    blast_radius:
      target: 1 instance of payment-svc
      duration_seconds: 60
      traffic_percent: 100
    rollback:
      automatic: true
      trigger_when: probe_pass_rate < 50% for 20s
      method: tc qdisc del dev eth0 root
    measurement:
      metrics: [probe_pass_rate, p99_latency, detector_alerts, rca_root_service]
      capture_window_seconds: 300
    ground_truth:
      expected_root_service: payment-svc
      expected_fault_class: latency

  - id: 2
    name: payment_network_loss
    fault_type: network_loss
    target: payment-svc
    hypothesis: |
      Steady-state: probe pass-rate >= 99%, p99 latency < 500ms.
      Injecting 30% packet loss on payment-svc network egress for 60s,
      pipeline detector fires error rate anomaly within 30s and RCA picks payment-svc.
    blast_radius:
      target: 1 instance of payment-svc
      duration_seconds: 60
      traffic_percent: 100
    rollback:
      automatic: true
      trigger_when: probe_pass_rate < 50% for 20s
      method: tc qdisc del dev eth0 root
    measurement:
      metrics: [probe_pass_rate, error_rate, detector_alerts, rca_root_service]
      capture_window_seconds: 300
    ground_truth:
      expected_root_service: payment-svc
      expected_fault_class: network_loss

  - id: 3
    name: inventory_availability
    fault_type: availability
    target: inventory-svc
    hypothesis: |
      Steady-state: probe pass-rate >= 99%.
      Killing inventory-svc pod every 60s, pipeline detector fires availability anomaly
      within 30s and RCA picks inventory-svc.
    blast_radius:
      target: 1 instance of inventory-svc
      duration_seconds: 60
      traffic_percent: 100
    rollback:
      automatic: true
      trigger_when: probe_pass_rate < 50% for 20s
      method: docker start w3d2-inventory-svc
    measurement:
      metrics: [probe_pass_rate, availability, detector_alerts, rca_root_service]
      capture_window_seconds: 300
    ground_truth:
      expected_root_service: inventory-svc
      expected_fault_class: availability

  - id: 4
    name: api_gateway_cpu_saturation
    fault_type: cpu_saturation
    target: api-gateway
    hypothesis: |
      Steady-state: probe pass-rate >= 99%.
      Injecting 90% CPU stress on api-gateway for 60s, causing cascade latency across all
      downstream services. Pipeline detector fires latency anomalies and RCA picks api-gateway.
    blast_radius:
      target: 1 instance of api-gateway
      duration_seconds: 60
      traffic_percent: 100
    rollback:
      automatic: true
      trigger_when: probe_pass_rate < 50% for 20s
      method: docker exec w3d2-api-gateway pkill -f while
    measurement:
      metrics: [probe_pass_rate, cpu_usage, cascade_latency, rca_root_service]
      capture_window_seconds: 300
    ground_truth:
      expected_root_service: api-gateway
      expected_fault_class: cpu_saturation

  - id: 5
    name: payment_db_memory_fill
    fault_type: memory
    target: payment-db
    hypothesis: |
      Steady-state: probe pass-rate >= 99%.
      Filling memory on payment-db to 95% for 60s, pipeline detector fires connection pool anomaly
      and RCA picks payment-db.
    blast_radius:
      target: 1 instance of payment-db
      duration_seconds: 60
      traffic_percent: 100
    rollback:
      automatic: true
      trigger_when: probe_pass_rate < 50% for 20s
      method: docker exec w3d2-payment-db pkill -f dd
    measurement:
      metrics: [probe_pass_rate, memory_usage, connection_pool, rca_root_service]
      capture_window_seconds: 300
    ground_truth:
      expected_root_service: payment-db
      expected_fault_class: memory

  - id: 6
    name: auth_time_skew
    fault_type: time_skew
