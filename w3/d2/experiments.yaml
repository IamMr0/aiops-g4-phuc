      expected_fault_class: time_skew

  - id: 7
    name: log_collector_disk_fill
    fault_type: disk_fill
    target: log-collector
    hypothesis: |
      Steady-state: log ingestion lag < 5s.
      Filling disk on log-collector to 95% for 60s, pipeline detector fires ingestion lag anomaly.
    blast_radius:
      target: 1 instance of log-collector
      duration_seconds: 60
      traffic_percent: 100
    rollback:
      automatic: true
      trigger_when: log_ingestion_lag > 20s
      method: docker exec w3d2-log-collector rm -f /tmp/fill
    measurement:
      metrics: [log_ingestion_lag, disk_usage, rca_root_service]
      capture_window_seconds: 300
    ground_truth:
      expected_root_service: log-collector
      expected_fault_class: disk_fill

  - id: 8
    name: frontend_network_partition
    fault_type: network_partition
    target: frontend
    hypothesis: |
      Steady-state: probe pass-rate >= 99%.
      Full network partition between frontend and api-gateway for 30s, causing all-downstream
      timeout. RCA picks edge (frontend).
    blast_radius:
      target: 1 instance of frontend
      duration_seconds: 30
      traffic_percent: 100
    rollback:
      automatic: true
      trigger_when: probe_pass_rate < 10%
      method: tc qdisc del dev eth0 root
    measurement:
      metrics: [probe_pass_rate, downstream_timeout, rca_root_service]
      capture_window_seconds: 300
    ground_truth:
      expected_root_service: frontend
      expected_fault_class: network_partition

  - id: 9
    name: dns_resolver_latency
    fault_type: dns_latency
    target: dns-resolver
    hypothesis: |
      Steady-state: probe pass-rate >= 99%.
      Slow DNS lookup (+2s) for 60s, causing intermittent errors. RCA depends on topology.
    blast_radius:
      target: 1 instance of dns-resolver
      duration_seconds: 60
      traffic_percent: 100
    rollback:
      automatic: true
      trigger_when: probe_pass_rate < 50%
      method: tc qdisc del dev eth0 root
    measurement:
      metrics: [probe_pass_rate, intermittent_error, rca_root_service]
      capture_window_seconds: 300
    ground_truth:
      expected_root_service: dns-resolver
      expected_fault_class: dns_latency

  - id: 10
    name: checkout_retry_storm
    fault_type: http_error
    target: checkout-svc
    hypothesis: |
      Steady-state: probe pass-rate >= 99%.
      Injecting 20% HTTP 500 on checkout-svc responses for 90s, client retries
      amplify load on upstream payment-svc + inventory-svc. Pipeline must NOT
      pick checkout-svc as root (it's the symptom carrier, not cause). RCA
      should pick payment-svc OR inventory-svc (whichever shows queue depth).
    blast_radius:
      target: 100% of checkout-svc requests
      duration_seconds: 90
      traffic_percent: 100
    rollback:
      automatic: true
      trigger_when: probe_pass_rate < 30% for 30s
      method: toxiproxy-cli toxic remove
    measurement:
      metrics: [probe_pass_rate, retry_count, upstream_queue_depth, rca_root_service]
      capture_window_seconds: 600
    ground_truth:
      expected_root_service: NOT checkout-svc  # negative test
      expected_fault_class: cascade_retry
