    hypothesis: |
      Steady-state: probe pass-rate >= 99%.
      Injecting +60s clock skew on auth-svc for 60s, pipeline detector fires JWT/cert failure
      anomaly and RCA picks auth-svc.
    blast_radius:
      target: 1 instance of auth-svc
      duration_seconds: 60
      traffic_percent: 100
    rollback:
      automatic: true
      trigger_when: probe_pass_rate < 50% for 20s
      method: docker exec w3d2-auth-svc date -s "-60 seconds"
    measurement:
      metrics: [probe_pass_rate, cert_failure, rca_root_service]
      capture_window_seconds: 300
    ground_truth:
